services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--chain-id"
      - "31337"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
      - "--gas-limit"
      - "30000000"
      - "--gas-price"
      - "20000000000"
      - "--code-size-limit"
      - "50000"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: azoth
      POSTGRES_USER: azoth_user
      POSTGRES_PASSWORD: azoth_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azoth_user -d azoth"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  api:
    image: ghcr.io/mirageprivacy/api:latest
    ports:
      - "3000:3000"
    environment:
      RUST_LOG: debug
      DATABASE_URL: postgresql://azoth_user:azoth_pass@postgres:5432/azoth
      FAUCET_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      TOKEN_CONTRACT_ADDRESS: "${TUSDC_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}"
      ETH_RPC_SEPOLIA: "http://anvil:8545"
      COMPLIANCE_PRIVATE_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
