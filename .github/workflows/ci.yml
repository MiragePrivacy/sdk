name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version is ahead of npm
        run: |
          name=$(jq -r .name package.json)
          local=$(jq -r .version package.json)

          # A package with no published release yet has nothing to be ahead of.
          published=$(npm view "$name" version 2>/dev/null) || published=""
          if [ -z "$published" ]; then
            echo "$name is not published yet; skipping"
            exit 0
          fi

          if [ -z "$(npx --yes semver -r ">$published" "$local")" ]; then
            echo "::error file=package.json::version $local must be greater than the published $published"
            exit 1
          fi

          echo "version bumped: $published -> $local"

  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` runs the build on install; --ignore-scripts keeps the build
      # as its own reportable step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk

      # The mock API serves bytecode from ../escrow/artifacts, so the escrow
      # repo has to sit beside the SDK checkout.
      - uses: actions/checkout@v4
        with:
          repository: MiragePrivacy/escrow
          path: escrow

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        working-directory: sdk
        run: npm ci --ignore-scripts

      - name: Integration tests
        working-directory: sdk
        run: npm run test:integration
